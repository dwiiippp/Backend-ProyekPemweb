{{define "content"}}
<div class="card">
  <h2>{{.Title}}</h2>
  <p>Pengajuan yang dicatat akan memiliki status aktif dan sisa kasbon sebesar nominal pengajuan.</p>
  <p><a href="/pekerja/kasbon">Kembali ke kasbon saya</a></p>
</div>
<div class="card">
  <form method="post" action="/pekerja/kasbon">
    <label>Nominal kasbon (Rp)
      <input type="number" name="nominal" min="0.01" max="9999999999.99" step="0.01" value="{{.Data.Nominal}}" required>
    </label>
    <label>Keterangan
      <textarea name="keterangan" rows="4" maxlength="2000">{{.Data.Keterangan}}</textarea>
    </label>
    <button class="btn" type="submit">Catat pengajuan</button>
  </form>
</div>
{{end}}
